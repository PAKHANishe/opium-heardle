<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPIUM HEARDLE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            /* КАРТИНКА НА ФОН */
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #050505;
            
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР ДЛЯ ИГРЫ */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            z-index: 2;
        }

        /* ИГРОВАЯ КАРТОЧКА */
        .container {
            background-color: rgba(0, 0, 0, 0.85); /* Полупрозрачный черный, чтобы фон слегка просвечивал */
            padding: 40px;
            border: 1px solid #222;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(5px); /* Эффект размытия под карточкой */
        }

        h1 {
            font-size: 24px;
            letter-spacing: 6px;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .status {
            font-size: 10px;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background-color: #111;
            margin-bottom: 25px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ffffff;
            transition: width 0.1s linear;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            background: none;
            border: 1px solid #333;
            color: #ffffff;
            padding: 15px;
            font-size: 11px;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        button:disabled {
            color: #333;
            border-color: #111;
            cursor: not-allowed;
        }

        .input-container {
            position: relative;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            background-color: #000000;
            border: 1px solid #333;
            color: #ffffff;
            padding: 15px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #666;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #000000;
            border: 1px solid #333;
            border-top: none;
            max-height: 150px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }

        .autocomplete-item {
            padding: 12px;
            font-size: 10px;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
            border-bottom: 1px solid #111;
        }

        .autocomplete-item:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .submit-btn {
            width: 100%;
            border-color: #333;
        }

        .message {
            margin-top: 25px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            min-height: 15px;
            line-height: 1.6;
        }

        .success { color: #ffffff; font-weight: bold; }
        .error { color: #777777; }

        .final-player {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #333;
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="container">
            <h1 id="game-title">OPIUM HEARDLE</h1>
            <div id="db-status" class="status">Загрузка базы...</div>

            <div class="progress-bar-container">
                <div id="progress" class="progress-bar"></div>
            </div>

            <div class="controls">
                <button id="play-btn" disabled>LISTEN</button>
                <button id="skip-btn" disabled>SKIP</button>
            </div>

            <div class="input-container">
                <input type="text" id="track-input" placeholder="ENTER ARTIST OR TRACK..." disabled autocomplete="off">
                <div id="autocomplete-box" class="autocomplete-list"></div>
            </div>

            <button id="submit-btn" class="submit-btn" disabled>SUBMIT</button>

            <div id="message" class="message"></div>
            <div id="final-player" class="final-player"></div>
        </div>
    </div>

    <script src="tracks.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('db-status');
            if (typeof tracksDatabase === 'undefined') {
                statusEl.textContent = "ОШИБКА: ФАЙЛ TRACKS.JS НЕ НАЙДЕН!";
                statusEl.style.color = "#ff0000";
                return;
            }
            statusEl.textContent = "UNDERGROUND EDITION";
            initGame();
        });

        function initGame() {
            const todayTrack = tracksDatabase[Math.floor(Math.random() * tracksDatabase.length)];
            let currentSeconds = 1;
            const maxSeconds = 16;
            const steps = [1, 2, 4, 7, 11, 16];
            let currentStepIndex = 0;
            let attempts = 0;

            const audio = new Audio();
            audio.src = todayTrack.url;

            const playBtn = document.getElementById('play-btn');
            const skipBtn = document.getElementById('skip-btn');
            const submitBtn = document.getElementById('submit-btn');
            const trackInput = document.getElementById('track-input');
            const autocompleteBox = document.getElementById('autocomplete-box');
            const progressBar = document.getElementById('progress');
            const messageEl = document.getElementById('message');
            const finalPlayerEl = document.getElementById('final-player');

            playBtn.disabled = false;
            skipBtn.disabled = false;
            submitBtn.disabled = false;
            trackInput.disabled = false;

            currentSeconds = steps[currentStepIndex];
            updateSkipButtonText();

            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.currentTime = todayTrack.startFrom || 0;
                    audio.play().catch(e => console.log("Нужен клик"));
                    playBtn.textContent = "PAUSE";
                    progressBar.style.width = '0%';
                    
                    let start = Date.now();
                    let duration = currentSeconds * 1000;
                    
                    clearInterval(window.progressInterval);
                    window.progressInterval = setInterval(() => {
                        let elapsed = Date.now() - start;
                        let progress = (elapsed / duration) * 100;
                        if (progress >= 100) {
                            progressBar.style.width = '100%';
                            clearInterval(window.progressInterval);
                        } else {
                            progressBar.style.width = progress + '%';
                        }
                    }, 50);

                    window.audioTimeout = setTimeout(() => {
                        audio.pause();
                        playBtn.textContent = "LISTEN";
                        progressBar.style.width = '0%';
                        clearInterval(window.progressInterval);
                    }, currentSeconds * 1000);
                } else {
                    stopAudio();
                }
            });

            function stopAudio() {
                audio.pause();
                clearTimeout(window.audioTimeout);
                clearInterval(window.progressInterval);
                playBtn.textContent = "LISTEN";
                progressBar.style.width = '0%';
            }

            skipBtn.addEventListener('click', () => {
                stopAudio();
                goToNextStep();
            });

            function goToNextStep() {
                attempts++;
                currentStepIndex++;
                if (currentStepIndex >= steps.length) {
                    endGame(false);
                } else {
                    currentSeconds = steps[currentStepIndex];
                    updateSkipButtonText();
                    messageEl.textContent = `ПРОПУЩЕНО. ШАГ ${currentStepIndex + 1}/6 (${currentSeconds} СЕК)`;
                    messageEl.className = "message error";
                }
            }

            function updateSkipButtonText() {
                if (currentStepIndex < steps.length - 1) {
                    skipBtn.textContent = `SKIP TO ${steps[currentStepIndex + 1]}s`;
                } else {
                    skipBtn.textContent = "SKIP TO END";
                }
            }

            submitBtn.addEventListener('click', () => {
                stopAudio();
                const guess = trackInput.value.trim().toLowerCase();
                if (!guess) return;

                const isCorrect = todayTrack.answers.some(ans => guess.includes(ans) || ans.includes(guess));

                if (isCorrect) {
                    endGame(true);
                } else {
                    trackInput.value = "";
                    messageEl.textContent = "НЕПРАВИЛЬНО. ПОПРОБУЙ ЕЩЕ РАЗ ИЛИ СКИПНИ";
                    messageEl.className = "message error";
                    goToNextStep();
                }
            });

            function endGame(win) {
                stopAudio();
                playBtn.disabled = true;
                skipBtn.disabled = true;
                submitBtn.disabled = true;
                trackInput.disabled = true;
                autocompleteBox.style.display = 'none';

                if (win) {
                    messageEl.textContent = `ЗАЕБАТО! ТЫ УГАДАЛ: ${todayTrack.artist} — ${todayTrack.title}`;
                    messageEl.className = "message success";
                } else {
                    messageEl.textContent = `ИГРА ОКОНЧЕНА. ЭТО БЫЛ ТРЕК: ${todayTrack.artist} — ${todayTrack.title}`;
                    messageEl.className = "message error";
                }

                if (todayTrack.embedCode) {
                    finalPlayerEl.innerHTML = todayTrack.embedCode;
                    finalPlayerEl.style.display = "block";
                }
            }

            trackInput.addEventListener('input', () => {
                const val = trackInput.value.trim().toLowerCase();
                autocompleteBox.innerHTML = '';
                if (!val) {
                    autocompleteBox.style.display = 'none';
                    return;
                }

                const filtered = allAutocompleteOptions.filter(opt => opt.toLowerCase().includes(val));
                if (filtered.length === 0) {
                    autocompleteBox.style.display = 'none';
                    return;
                }

                filtered.forEach(opt => {
                    const item = document.createElement('div');
                    item.className = 'autocomplete-item';
                    item.textContent = opt;
                    item.addEventListener('click', () => {
                        trackInput.value = opt;
                        autocompleteBox.style.display = 'none';
                    });
                    autocompleteBox.appendChild(item);
                });
                autocompleteBox.style.display = 'block';
            });

            document.addEventListener('click', (e) => {
                if (e.target !== trackInput) {
                    autocompleteBox.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
